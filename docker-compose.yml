services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bulaeff-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: bulaeff-db
    environment:
      POSTGRES_DB: bulaeff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulaeff"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_venv: